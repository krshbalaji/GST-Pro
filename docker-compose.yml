services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gstpro
      POSTGRES_USER: gstpro
      POSTGRES_PASSWORD: gstpro
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://gstpro:gstpro@db:5432/gstpro
      MOCK_EINVOICE: "true"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata: