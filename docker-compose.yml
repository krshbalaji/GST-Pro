services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gstpro}
      POSTGRES_USER: ${POSTGRES_USER:-gstpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gstpro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gstpro}:${POSTGRES_PASSWORD:-gstpro}@db:5432/${POSTGRES_DB:-gstpro}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-use-a-strong-secret}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MOCK_EINVOICE: ${MOCK_EINVOICE:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
