name: Release Candidate Validation

on:
  push:
    branches:
      - level9/release-candidate
  pull_request:
    branches:
      - level9/release-candidate
  workflow_dispatch:

jobs:
  backend-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          JWT_SECRET=rc-validation-secret-012345678901234567890123456789           docker compose config
      - name: Build API image
        run: docker build -t gst-pro-api:rc -f backend/Dockerfile .
      - name: Build frontend image
        run: docker build -t gst-pro-web:rc ./frontend
