name: Release Candidate Validation

on:
  push:
    branches:
      - level9/release-candidate
  pull_request:
    branches:
      - level9/release-candidate
  workflow_dispatch:

jobs:
  backend-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app

  backend-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gstpro
          POSTGRES_USER: gstpro
          POSTGRES_PASSWORD: gstpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gstpro -d gstpro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GSTPRO_MODE: production
      ENVIRONMENT: production
      JWT_SECRET: rc-validation-secret-012345678901234567890123456789
      POSTGRES_PASSWORD: gstpro
      DATABASE_URL: postgresql+psycopg://gstpro:gstpro@localhost:5432/gstpro
      MOCK_EINVOICE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Initialize database schema
        run: |
          PGPASSWORD=gstpro psql -h localhost -U gstpro -d gstpro -f database/schema.sql

      - name: Seed production integration tenant
        env:
          GSTPRO_BOOTSTRAP: "1"
        run: |
          PYTHONPATH=backend python -c "from app.production_bootstrap import bootstrap_production; from app.storage import store; bootstrap_production(store)"

      - name: Run focused production regression suite
        run: |
          python -m pytest -q \
            backend/tests/test_einvoice_provider_boundary.py \
            backend/tests/test_level4_invoice_lifecycle.py \
            backend/tests/test_production_repository_unit.py \
            backend/tests/test_production_integration.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: rc-validation-secret-012345678901234567890123456789
      POSTGRES_PASSWORD: gstpro
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build API image
        run: docker build -t gst-pro-api:rc -f backend/Dockerfile .
      - name: Build frontend image
        run: docker build -t gst-pro-web:rc ./frontend