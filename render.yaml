services:
  - type: web
    name: gstpro-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: GSTPRO_MODE
        value: production
      - key: ENVIRONMENT
        value: production
      - key: MOCK_EINVOICE
        value: "true"
      # Seed the shared test tenant/accounts on first production startup.
      # Disable/remove this before any commercial deployment.
      - key: GSTPRO_BOOTSTRAP
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: gstpro-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: "0.0.0.0"
